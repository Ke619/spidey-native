name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.1+
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund


      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build unsigned .app
        run: |
          cd ios
          xcodebuild \
            -workspace spideynative.xcworkspace \
            -scheme spideynative \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/spideynative.app Payload/
          zip -r spideynative.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: spideynative-ipa
          path: spideynative.ipa
          retention-days: 30
